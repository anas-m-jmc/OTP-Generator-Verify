<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OTP Generator & Verification</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 400px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h1 {
            color: #333;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 95%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .otp {
            font-size: 28px;
            font-weight: bold;
            color: #28a745;
            margin: 20px;
            letter-spacing: 5px;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>OTP Verification</h1>

        <p>Click the button to generate a 6-digit OTP.</p>

        <form method="POST">
            <input type="hidden" name="action" value="generate">

            <button type="submit">
                Generate OTP
            </button>
        </form>

        {% if otp_display %}
            <div class="otp">
                {{ otp_display }}
            </div>
        {% endif %}

        <hr>

        <h3>Enter OTP</h3>

        <form method="POST">

            <input
                type="text"
                name="otp"
                placeholder="Enter 6-digit OTP"
                maxlength="6"
                required
            >

            <input type="hidden" name="action" value="verify">

            <button type="submit">
                Verify OTP
            </button>

        </form>

        {% if message %}
            <div class="message">
                {{ message }}
            </div>
        {% endif %}

    </div>

</body>

</html>
